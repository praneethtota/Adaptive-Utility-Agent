# AUA Framework — Prometheus Alert Rules
# Load in prometheus.yml under rule_files:
#   rule_files:
#     - /etc/prometheus/alerts.yml

groups:
  - name: aua_core
    interval: 30s
    rules:

      - alert: AUA_SpecialistDown
        expr: up{job=~"aua.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AUA specialist is down"
          description: "Specialist {{ $labels.job }} unreachable for 1m."

      - alert: AUA_SpecialistHighLatency
        expr: histogram_quantile(0.95, rate(aua_query_latency_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AUA p95 latency > 30s"
          description: "p95 latency {{ $value | humanizeDuration }} in {{ $labels.domain }}."

      - alert: AUA_LowUtilityScore
        expr: aua_utility_score < 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AUA utility score critically low"
          description: "U-score for {{ $labels.domain }} < 0.3 for 10m."

      - alert: AUA_HighContradictionRate
        expr: rate(aua_contradiction_rate[10m]) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AUA contradiction rate elevated"
          description: "Contradiction rate in {{ $labels.domain }} > 30%."

      - alert: AUA_BlueGreenStalled
        expr: changes(aua_bluegreen_traffic_split[1h]) == 0 and aua_bluegreen_traffic_split{variant="green"} > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "AUA blue-green stalled"
          description: "GREEN active for {{ $labels.specialist }} but no promotion in 2h."

      - alert: AUA_ArbiterCaseFourSpike
        expr: rate(aua_arbiter_verdict_distribution{case="case_4"}[15m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AUA arbiter inconclusive spikes"
          description: "Arbiter Case 4 > 50% of verdicts."

      - alert: AUA_TokenRejectionSpike
        expr: rate(aua_token_requests_total{status="rejected"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AUA token rejections spiking"
          description: "{{ $value }}/s rejections — possible brute-force or misconfigured client."

      - alert: AUA_PluginFailureSpike
        expr: rate(aua_hook_failures_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AUA plugin/hook failures spiking"
          description: "Hook failures at {{ $labels.hook_point }} > 5/s."
