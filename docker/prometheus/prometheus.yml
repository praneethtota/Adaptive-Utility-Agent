# Prometheus config for AUA Framework observability stack
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: aua-framework

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: aua-router
    static_configs:
      - targets: ["router:8000"]
    metrics_path: /metrics
    scrape_interval: 10s
