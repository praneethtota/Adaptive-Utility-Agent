# Tier: single-4090
# Backend: vLLM (AWQ quantized)
# Alias: rtx4090 (backward-compatible)
#
# Measured configuration from RunPod RTX 4090 POC (May 2026).
# 3 services fit concurrently at 90.4% VRAM (22,206 / 24,564 MiB).
# Sequential startup with --enforce-eager is required on consumer GPUs.
#
# Hardware:  1× NVIDIA RTX 4090 (24 GB VRAM)
# Services:  swe (9001) + math (9002) + arbiter (9003) + router (8000)
# VRAM:      swe 34% + math 34% + arbiter 18% = 86% used, 14% headroom
# Cost:      ~$0.69/hr on RunPod (on-demand)
#
# Recommended for: development, single-domain workloads, cost-sensitive POC

aua:
  version: "1.2"
  mode: local
  backend: vllm

specialists:
  - name: swe
    model: Qwen/Qwen2.5-Coder-7B-Instruct-AWQ  # 7B AWQ — fits in 8.2 GB VRAM
    port: 9001
    field: software_engineering
    gpu: 0
    gpu_memory_utilization: 0.34
    max_model_len: 2048
    quantization: awq
    enforce_eager: true   # required — prevents CUDA graph OOM on consumer GPUs

  - name: math
    model: Qwen/Qwen2.5-7B-Instruct-AWQ         # 7B AWQ — fits in 8.2 GB VRAM
    port: 9002
    field: mathematics
    gpu: 0
    gpu_memory_utilization: 0.34
    max_model_len: 2048
    quantization: awq
    enforce_eager: true

arbiter:
  model: Qwen/Qwen2.5-3B-Instruct-AWQ           # 3B AWQ — fits in 4.4 GB VRAM
  port: 9003
  gpu: 0
  gpu_memory_utilization: 0.18
  max_model_len: 2048
  quantization: awq
  enforce_eager: true

router:
  port: 8000
  host: "0.0.0.0"
  single_domain_threshold: 0.75
  fanout_threshold: 0.30
  specialist_timeout: 60.0

blue_green:
  swe:
    delta: 0.025   # promote if GREEN U score ≥ BLUE + 2.5%
    T_min: 10      # need ≥10 canary interactions before decision
    tau: 0.20      # softmax temperature for traffic split
  math:
    delta: 0.025
    T_min: 10
    tau: 0.20

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
